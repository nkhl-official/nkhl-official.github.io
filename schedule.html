let currentWeek = 0;


function formatDate(dateString) {

    const date = new Date(dateString + "T00:00:00");

    return date.toLocaleDateString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric"
    });

}


function createTeam(team, side) {

    const wrapper = document.createElement("div");

    wrapper.className = `team ${side}`;

    const logo = document.createElement("img");

    logo.className = "team-logo";

    logo.src = teamLogos[team];

    logo.alt = `${team} logo`;

    const name = document.createElement("span");

    name.textContent = team;

    if (side === "home") {

        wrapper.appendChild(name);
        wrapper.appendChild(logo);

    } else {

        wrapper.appendChild(logo);
        wrapper.appendChild(name);

    }

    return wrapper;

}


function createGameCard(game) {

    const date = game[0];
    const homeTeam = game[1];
    const awayTeam = game[2];
    const homeScore = game[3];
    const awayScore = game[4];
    const resultType = game[5];

    const card = document.createElement("div");

    card.className = "game-card";


    const dateElement = document.createElement("div");

    dateElement.className = "game-date";

    dateElement.textContent = formatDate(date);


    const matchup = document.createElement("div");

    matchup.className = "matchup";


    const home = createTeam(homeTeam, "home");

    const vs = document.createElement("span");

    vs.className = "vs";

    vs.textContent = "VS";

    const away = createTeam(awayTeam, "away");


    matchup.appendChild(home);
    matchup.appendChild(vs);
    matchup.appendChild(away);


    const scoreContainer = document.createElement("div");

    scoreContainer.className = "score-container";


    const scoreBox = document.createElement("div");

    scoreBox.className = "score-box";


    if (homeScore !== null && awayScore !== null) {

        scoreBox.classList.add("final");

        if (resultType === "OT" || resultType === "SO") {

            scoreBox.textContent =
                `${homeScore} - ${awayScore} (${resultType})`;

        } else {

            scoreBox.textContent =
                `${homeScore} - ${awayScore}`;

        }

    } else {

        scoreBox.textContent = "—";

    }


    scoreContainer.appendChild(scoreBox);


    card.appendChild(dateElement);
    card.appendChild(matchup);
    card.appendChild(scoreContainer);


    return card;

}


function createWeekSlide(week) {

    const slide = document.createElement("div");

    slide.className = "carousel-slide";


    const header = document.createElement("div");

    header.className = "week-header";


    const title = document.createElement("h3");

    title.className = "week-title";

    title.textContent = week.name;


    const date = document.createElement("p");

    date.className = "week-date";

    date.textContent = week.dates;


    header.appendChild(title);
    header.appendChild(date);

    slide.appendChild(header);


    if (week.bye) {

        const bye = document.createElement("div");

        bye.className = "bye-week";


        const byeTitle = document.createElement("h3");

        byeTitle.textContent = "Bye Week";


        const byeText = document.createElement("p");

        byeText.textContent = "No games scheduled this week.";


        bye.appendChild(byeTitle);
        bye.appendChild(byeText);

        slide.appendChild(bye);

        return slide;

    }


    const gamesList = document.createElement("div");

    gamesList.className = "games-list";


    week.games.forEach(game => {

        gamesList.appendChild(
            createGameCard(game)
        );

    });


    slide.appendChild(gamesList);


    return slide;

}


function renderSchedule() {

    const track = document.getElementById("carousel-track");

    const selector = document.getElementById("week-selector");

    const dots = document.getElementById("week-dots");


    track.innerHTML = "";
    selector.innerHTML = "";
    dots.innerHTML = "";


    schedule.forEach((week, index) => {

        track.appendChild(
            createWeekSlide(week)
        );


        const option = document.createElement("option");

        option.value = index;

        option.textContent = week.name;

        if (week.bye) {
            option.textContent += " — Bye";
        }

        selector.appendChild(option);


        const dot = document.createElement("button");

        dot.className = "week-dot";

        if (week.bye) {
            dot.classList.add("bye");
        }

        dot.setAttribute(
            "aria-label",
            `Go to ${week.name}`
        );

        dot.addEventListener("click", () => {

            goToWeek(index);

        });


        dots.appendChild(dot);

    });


    updateCarousel();

}


function goToWeek(index) {

    if (index < 0) {
        index = 0;
    }

    if (index >= schedule.length) {
        index = schedule.length - 1;
    }

    currentWeek = index;

    updateCarousel();

}


function updateCarousel() {

    const track = document.getElementById("carousel-track");

    const selector = document.getElementById("week-selector");

    const dots = document.querySelectorAll(".week-dot");

    const prev = document.getElementById("prev");

    const next = document.getElementById("next");


    track.style.transform =
        `translateX(-${currentWeek * 100}%)`;


    selector.value = currentWeek;


    dots.forEach((dot, index) => {

        dot.classList.toggle(
            "active",
            index === currentWeek
        );

    });


    prev.disabled = currentWeek === 0;

    next.disabled = currentWeek === schedule.length - 1;

}


document.getElementById("prev").addEventListener(
    "click",
    () => {

        goToWeek(currentWeek - 1);

    }
);


document.getElementById("next").addEventListener(
    "click",
    () => {

        goToWeek(currentWeek + 1);

    }
);


document.getElementById("week-selector").addEventListener(
    "change",
    event => {

        goToWeek(
            Number(event.target.value)
        );

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (event.key === "ArrowLeft") {

            goToWeek(currentWeek - 1);

        }

        if (event.key === "ArrowRight") {

            goToWeek(currentWeek + 1);

        }

    }
);


let touchStartX = 0;
let touchEndX = 0;


const carousel = document.querySelector(
    ".schedule-carousel"
);


carousel.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    { passive: true }
);


carousel.addEventListener(
    "touchend",
    event => {

        touchEndX =
            event.changedTouches[0].screenX;


        const difference =
            touchStartX - touchEndX;


        if (Math.abs(difference) < 50) {
            return;
        }


        if (difference > 0) {

            goToWeek(currentWeek + 1);

        } else {

            goToWeek(currentWeek - 1);

        }

    },
    { passive: true }
);


renderSchedule();
