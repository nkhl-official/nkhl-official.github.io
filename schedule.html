/* =========================================================
   CREATE TEAM
   ========================================================= */

function createTeam(teamName, side) {

    const logo =
        teamLogos[teamName] || "";

    if (side === "home") {

        return `
            <div class="team home">

                <span>${teamName}</span>

                <img
                    class="team-logo"
                    src="${logo}"
                    alt="${teamName} logo"
                    onerror="this.style.display='none';"
                >

            </div>
        `;

    }

    return `
        <div class="team away">

            <img
                class="team-logo"
                src="${logo}"
                alt="${teamName} logo"
                onerror="this.style.display='none';"
            >

            <span>${teamName}</span>

        </div>
    `;
}


/* =========================================================
   CREATE GAME
   ========================================================= */

function createGame(game) {

    const score =
        game.score ? game.score : "—";

    const scoreClass =
        game.score
            ? "score-box final"
            : "score-box";


    return `
        <div class="game-card">

            <div class="game-date">
                ${game.date}
            </div>


            <div class="matchup">

                ${createTeam(game.home, "home")}

                <span class="vs">
                    VS
                </span>

                ${createTeam(game.away, "away")}

            </div>


            <div class="score-container">

                <div class="${scoreClass}">
                    ${score}
                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   RENDER SCHEDULE
   ========================================================= */

function renderSchedule() {

    track.innerHTML = "";

    weekSelector.innerHTML = "";

    weekDots.innerHTML = "";


    schedule.forEach((week, index) => {

        /* -------------------------
           CREATE SLIDE
           ------------------------- */

        const slide =
            document.createElement("div");

        slide.className =
            "carousel-slide";


        slide.innerHTML = `

            <div class="week-header">

                <h3 class="week-title">
                    Week ${week.week}
                </h3>

                <div class="week-date">
                    ${week.startDate} – ${week.endDate}
                </div>

            </div>


            <div class="games-list">

                ${week.games
                    .map(createGame)
                    .join("")}

            </div>
        `;


        track.appendChild(slide);


        /* -------------------------
           WEEK SELECTOR
           ------------------------- */

        const option =
            document.createElement("option");

        option.value = index;

        option.textContent =
            `Week ${week.week}`;

        weekSelector.appendChild(option);


        /* -------------------------
           WEEK DOT
           ------------------------- */

        const dot =
            document.createElement("button");

        dot.className =
            "week-dot";

        dot.type =
            "button";

        dot.setAttribute(
            "aria-label",
            `Go to Week ${week.week}`
        );


        dot.addEventListener(
            "click",
            () => {

                currentIndex = index;

                updateCarousel();

            }
        );


        weekDots.appendChild(dot);

    });


    updateCarousel();
}


/* =========================================================
   UPDATE CAROUSEL
   ========================================================= */

function updateCarousel() {

    track.style.transform =
        `translateX(-${currentIndex * 100}%)`;


    prevButton.disabled =
        currentIndex === 0;


    nextButton.disabled =
        currentIndex === schedule.length - 1;


    weekSelector.value =
        currentIndex;


    document
        .querySelectorAll(".week-dot")
        .forEach((dot, index) => {

            dot.classList.toggle(
                "active",
                index === currentIndex
            );

        });
}


/* =========================================================
   NEXT BUTTON
   ========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        if (
            currentIndex <
            schedule.length - 1
        ) {

            currentIndex++;

            updateCarousel();

        }

    }
);


/* =========================================================
   PREVIOUS BUTTON
   ========================================================= */

prevButton.addEventListener(
    "click",
    () => {

        if (currentIndex > 0) {

            currentIndex--;

            updateCarousel();

        }

    }
);


/* =========================================================
   WEEK SELECTOR
   ========================================================= */

weekSelector.addEventListener(
    "change",
    (event) => {

        currentIndex =
            Number(event.target.value);

        updateCarousel();

    }
);


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "ArrowRight" &&
            currentIndex < schedule.length - 1
        ) {

            currentIndex++;

            updateCarousel();

        }


        if (
            event.key === "ArrowLeft" &&
            currentIndex > 0
        ) {

            currentIndex--;

            updateCarousel();

        }

    }
);


/* =========================================================
   SWIPE SUPPORT
   ========================================================= */

let touchStartX = 0;

let touchEndX = 0;


track.addEventListener(
    "touchstart",
    (event) => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    { passive: true }
);


track.addEventListener(
    "touchend",
    (event) => {

        touchEndX =
            event.changedTouches[0].screenX;


        const swipeDistance =
            touchEndX - touchStartX;


        if (
            Math.abs(swipeDistance) < 50
        ) {
            return;
        }


        /* Swipe left */

        if (swipeDistance < 0) {

            if (
                currentIndex <
                schedule.length - 1
            ) {

                currentIndex++;

                updateCarousel();

            }

        }


        /* Swipe right */

        else {

            if (currentIndex > 0) {

                currentIndex--;

                updateCarousel();

            }

        }

    },
    { passive: true }
);


/* =========================================================
   START
   ========================================================= */

renderSchedule();

</script>

</body>
</html>
