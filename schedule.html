const carouselTrack = document.getElementById("carouselTrack");
const weekSelector = document.getElementById("weekSelector");
const weekDots = document.getElementById("weekDots");

let currentWeek = 0;


/* =========================
   CREATE TEAM HTML
   ========================= */

function createTeam(team, side) {

    const div = document.createElement("div");
    div.className = `team ${side}`;

    const img = document.createElement("img");
    img.className = "team-logo";
    img.src = teamLogos[team];
    img.alt = `${team} logo`;

    const name = document.createElement("span");
    name.textContent = team;

    if (side === "home") {
        div.appendChild(name);
        div.appendChild(img);
    } else {
        div.appendChild(img);
        div.appendChild(name);
    }

    return div;
}


/* =========================
   CREATE GAME HTML
   ========================= */

function createGame(game) {

    const card = document.createElement("div");
    card.className = "game-card";

    const date = document.createElement("div");
    date.className = "game-date";
    date.textContent = game.date;

    const matchup = document.createElement("div");
    matchup.className = "matchup";

    matchup.appendChild(createTeam(game.home, "home"));

    const vs = document.createElement("span");
    vs.className = "vs";
    vs.textContent = "VS";

    matchup.appendChild(vs);

    matchup.appendChild(createTeam(game.away, "away"));

    const scoreContainer = document.createElement("div");
    scoreContainer.className = "score-container";

    const score = document.createElement("div");
    score.className = "score-box";

    if (game.score) {
        score.textContent = game.score;
        score.classList.add("final");
    } else {
        score.textContent = "—";
    }

    scoreContainer.appendChild(score);

    card.appendChild(date);
    card.appendChild(matchup);
    card.appendChild(scoreContainer);

    return card;
}


/* =========================
   RENDER WEEKS
   ========================= */

function renderWeeks() {

    carouselTrack.innerHTML = "";
    weekSelector.innerHTML = "";
    weekDots.innerHTML = "";

    weeks.forEach((week, index) => {

        const slide = document.createElement("div");
        slide.className = "carousel-slide";

        const header = document.createElement("div");
        header.className = "week-header";

        const title = document.createElement("div");
        title.className = "week-title";
        title.textContent = week.name;

        const date = document.createElement("div");
        date.className = "week-date";
        date.textContent = week.date;

        header.appendChild(title);
        header.appendChild(date);

        slide.appendChild(header);


        if (week.bye) {

            const bye = document.createElement("div");
            bye.className = "bye-week";

            const byeTitle = document.createElement("h3");
            byeTitle.textContent = "BYE WEEK";

            const byeText = document.createElement("p");
            byeText.textContent = "No games are scheduled this week.";

            bye.appendChild(byeTitle);
            bye.appendChild(byeText);

            slide.appendChild(bye);

        } else {

            const gamesList = document.createElement("div");
            gamesList.className = "games-list";

            week.games.forEach(game => {
                gamesList.appendChild(createGame(game));
            });

            slide.appendChild(gamesList);
        }


        carouselTrack.appendChild(slide);


        const option = document.createElement("option");
        option.value = index;
        option.textContent = week.name;

        weekSelector.appendChild(option);


        const dot = document.createElement("button");
        dot.className = "week-dot";
        dot.setAttribute("aria-label", `Go to ${week.name}`);

        dot.addEventListener("click", () => {
            goToWeek(index);
        });

        weekDots.appendChild(dot);
    });

    updateCarousel();
}


/* =========================
   CAROUSEL CONTROL
   ========================= */

function goToWeek(index) {

    if (index < 0) {
        index = 0;
    }

    if (index >= weeks.length) {
        index = weeks.length - 1;
    }

    currentWeek = index;

    updateCarousel();
}


function updateCarousel() {

    carouselTrack.style.transform =
        `translateX(-${currentWeek * 100}%)`;

    weekSelector.value = currentWeek;

    const dots = document.querySelectorAll(".week-dot");

    dots.forEach((dot, index) => {
        dot.classList.toggle("active", index === currentWeek);
    });

    document.getElementById("prev").disabled =
        currentWeek === 0;

    document.getElementById("next").disabled =
        currentWeek === weeks.length - 1;
}


/* =========================
   BUTTONS
   ========================= */

document.getElementById("prev").addEventListener("click", () => {
    goToWeek(currentWeek - 1);
});

document.getElementById("next").addEventListener("click", () => {
    goToWeek(currentWeek + 1);
});


weekSelector.addEventListener("change", () => {
    goToWeek(Number(weekSelector.value));
});


/* =========================
   KEYBOARD NAVIGATION
   ========================= */

document.addEventListener("keydown", event => {

    if (event.key === "ArrowLeft") {
        goToWeek(currentWeek - 1);
    }

    if (event.key === "ArrowRight") {
        goToWeek(currentWeek + 1);
    }
});


/* =========================
   TOUCH SWIPING
   ========================= */

let touchStartX = 0;
let touchEndX = 0;

carouselTrack.addEventListener("touchstart", event => {
    touchStartX = event.changedTouches[0].screenX;
});

carouselTrack.addEventListener("touchend", event => {

    touchEndX = event.changedTouches[0].screenX;

    const difference = touchStartX - touchEndX;

    if (Math.abs(difference) < 50) {
        return;
    }

    if (difference > 0) {
        goToWeek(currentWeek + 1);
    } else {
        goToWeek(currentWeek - 1);
    }
});


/* =========================
   START
   ========================= */

renderWeeks();
