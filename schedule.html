const scoreStorageKey = "nkhl-schedule-scores";

let savedScores = {};

try {
    savedScores = JSON.parse(localStorage.getItem(scoreStorageKey) || "{}");
} catch {
    savedScores = {};
}

let currentWeek = 0;

const track = document.getElementById("carousel-track");
const prevButton = document.getElementById("prev");
const nextButton = document.getElementById("next");
const selector = document.getElementById("week-selector");
const dots = document.getElementById("week-dots");

function formatDate(dateString) {
    const date = new Date(dateString + "T12:00:00");

    return date.toLocaleDateString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric"
    });
}

function formatDateRange(start, end) {
    const startDate = new Date(start + "T12:00:00");
    const endDate = new Date(end + "T12:00:00");

    const startText = startDate.toLocaleDateString("en-US", {
        month: "long",
        day: "numeric"
    });

    const endText = endDate.toLocaleDateString("en-US", {
        month: "long",
        day: "numeric"
    });

    return `${startText} – ${endText}`;
}

function gameId(date, home, away) {
    return `${date}|${home}|${away}`;
}

function createTeam(team, side) {
    const wrapper = document.createElement("div");
    wrapper.className = `team ${side}`;

    const name = document.createElement("span");
    name.textContent = team;

    const logo = document.createElement("img");
    logo.className = "team-logo";
    logo.src = teamLogos[team] || "";
    logo.alt = `${team} logo`;

    logo.onerror = function() {
        this.style.display = "none";
    };

    if (side === "home") {
        wrapper.appendChild(name);
        wrapper.appendChild(logo);
    } else {
        wrapper.appendChild(logo);
        wrapper.appendChild(name);
    }

    return wrapper;
}

function createGameCard(game) {
    const date = game[0];
    const home = game[1];
    const away = game[2];
    const id = gameId(date, home, away);
    const saved = savedScores[id];

    const card = document.createElement("div");
    card.className = "game-card";

    const dateElement = document.createElement("div");
    dateElement.className = "game-date";
    dateElement.textContent = formatDate(date);

    const matchup = document.createElement("div");
    matchup.className = "matchup";

    matchup.appendChild(createTeam(home, "home"));

    const vs = document.createElement("span");
    vs.className = "vs";
    vs.textContent = "VS";

    matchup.appendChild(vs);
    matchup.appendChild(createTeam(away, "away"));

    const scoreContainer = document.createElement("div");
    scoreContainer.className = "score-container";

    const scoreBox = document.createElement("div");
    scoreBox.className = "score-box";

    const scoreInputs = document.createElement("div");
    scoreInputs.className = "score-inputs";

    const homeInput = document.createElement("input");
    homeInput.className = "score-input";
    homeInput.type = "number";
    homeInput.min = "0";
    homeInput.max = "99";
    homeInput.inputMode = "numeric";
    homeInput.placeholder = "0";
    homeInput.setAttribute("aria-label", `${home} score`);

    const dash = document.createElement("span");
    dash.className = "score-dash";
    dash.textContent = "-";

    const awayInput = document.createElement("input");
    awayInput.className = "score-input";
    awayInput.type = "number";
    awayInput.min = "0";
    awayInput.max = "99";
    awayInput.inputMode = "numeric";
    awayInput.placeholder = "0";
    awayInput.setAttribute("aria-label", `${away} score`);

    if (saved) {
        homeInput.value = saved.home;
        awayInput.value = saved.away;
        scoreBox.classList.add("final");
    }

    scoreInputs.appendChild(homeInput);
    scoreInputs.appendChild(dash);
    scoreInputs.appendChild(awayInput);

    const saveButton = document.createElement("button");
    saveButton.className = "score-save";
    saveButton.type = "button";
    saveButton.textContent = saved ? "Update" : "Save";

    const status = document.createElement("div");
    status.className = "score-status";
    status.textContent = saved ? "FINAL" : "Enter score";

    const clearButton = document.createElement("button");
    clearButton.className = "clear-score";
    clearButton.type = "button";
    clearButton.textContent = "Clear";
    clearButton.style.display = saved ? "block" : "none";

    saveButton.addEventListener("click", () => {
        const homeScore = homeInput.value.trim();
        const awayScore = awayInput.value.trim();

        if (homeScore === "" || awayScore === "") {
            alert("Enter both scores before saving.");
            return;
        }

        savedScores[id] = {
            home: Number(homeScore),
            away: Number(awayScore)
        };

        localStorage.setItem(
            scoreStorageKey,
            JSON.stringify(savedScores)
        );

        scoreBox.classList.add("final");
        saveButton.textContent = "Update";
        status.textContent = "FINAL";
        clearButton.style.display = "block";
    });

    clearButton.addEventListener("click", () => {
        delete savedScores[id];

        localStorage.setItem(
            scoreStorageKey,
            JSON.stringify(savedScores)
        );

        homeInput.value = "";
        awayInput.value = "";

        scoreBox.classList.remove("final");
        saveButton.textContent = "Save";
        status.textContent = "Enter score";
        clearButton.style.display = "none";
    });

    scoreBox.appendChild(scoreInputs);
    scoreBox.appendChild(saveButton);
    scoreBox.appendChild(status);
    scoreBox.appendChild(clearButton);

    scoreContainer.appendChild(scoreBox);

    card.appendChild(dateElement);
    card.appendChild(matchup);
    card.appendChild(scoreContainer);

    return card;
}

function renderSchedule() {
    track.innerHTML = "";
    selector.innerHTML = "";
    dots.innerHTML = "";

    schedule.forEach((week, index) => {
        const slide = document.createElement("section");
        slide.className = "carousel-slide";

        const header = document.createElement("div");
        header.className = "week-header";

        const title = document.createElement("h3");
        title.className = "week-title";
        title.textContent = `Week ${week.week}`;

        const date = document.createElement("p");
        date.className = "week-date";
        date.textContent = formatDateRange(week.start, week.end);

        header.appendChild(title);
        header.appendChild(date);
        slide.appendChild(header);

        if (week.games.length === 0) {
            const bye = document.createElement("div");
            bye.className = "bye-week";

            const byeTitle = document.createElement("h3");
            byeTitle.textContent = "BYE WEEK";

            const byeText = document.createElement("p");
            byeText.textContent = "No games scheduled this week.";

            bye.appendChild(byeTitle);
            bye.appendChild(byeText);
            slide.appendChild(bye);
        } else {
            const gamesList = document.createElement("div");
            gamesList.className = "games-list";

            week.games.forEach(game => {
                gamesList.appendChild(createGameCard(game));
            });

            slide.appendChild(gamesList);
        }

        track.appendChild(slide);

        const option = document.createElement("option");
        option.value = index;
        option.textContent = week.games.length === 0
            ? `Week ${week.week} — Bye`
            : `Week ${week.week}`;

        selector.appendChild(option);

        const dot = document.createElement("button");
        dot.className = "week-dot";

        if (week.games.length === 0) {
            dot.classList.add("bye");
        }

        dot.setAttribute("aria-label", `Go to Week ${week.week}`);

        dot.addEventListener("click", () => {
            goToWeek(index);
        });

        dots.appendChild(dot);
    });

    updateCarousel();
}

function goToWeek(index) {
    currentWeek = Math.max(
        0,
        Math.min(index, schedule.length - 1)
    );

    updateCarousel();
}

function updateCarousel() {
    track.style.transform = `translateX(-${currentWeek * 100}%)`;

    prevButton.disabled = currentWeek === 0;
    nextButton.disabled = currentWeek === schedule.length - 1;

    selector.value = currentWeek;

    document.querySelectorAll(".week-dot").forEach((dot, index) => {
        dot.classList.toggle(
            "active",
            index === currentWeek
        );
    });
}

prevButton.addEventListener("click", () => {
    if (currentWeek > 0) {
        currentWeek--;
        updateCarousel();
    }
});

nextButton.addEventListener("click", () => {
    if (currentWeek < schedule.length - 1) {
        currentWeek++;
        updateCarousel();
    }
});

selector.addEventListener("change", event => {
    goToWeek(Number(event.target.value));
});

document.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft" && currentWeek > 0) {
        currentWeek--;
        updateCarousel();
    }

    if (
        event.key === "ArrowRight" &&
        currentWeek < schedule.length - 1
    ) {
        currentWeek++;
        updateCarousel();
    }
});

let touchStartX = 0;
let touchEndX = 0;

track.addEventListener("touchstart", event => {
    touchStartX = event.changedTouches[0].screenX;
}, { passive: true });

track.addEventListener("touchend", event => {
    touchEndX = event.changedTouches[0].screenX;

    if (
        touchEndX < touchStartX - 50 &&
        currentWeek < schedule.length - 1
    ) {
        currentWeek++;
        updateCarousel();
    }

    if (
        touchEndX > touchStartX + 50 &&
        currentWeek > 0
    ) {
        currentWeek--;
        updateCarousel();
    }
}, { passive: true });

renderSchedule();
</script>
